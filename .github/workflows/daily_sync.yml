name: CBV Daily Sync & Push

on:
  schedule:
    # 06:00 UTC corresponds to 03:00 BRT (Brasília Standard Time UTC-3)
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
permissions:
  contents: write

concurrency:
  group: cbv-daily-publication
  cancel-in-progress: false

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore source archive
        uses: actions/cache@v4
        with:
          path: data/raw
          key: cbv-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: cbv-raw-${{ runner.os }}-

      - name: Run Daily Synchronization Pipeline
        run: |
          python scripts/daily_update.py

      - name: Run Mandatory Pre-Publish Quality Gates & Smoke Tests
        run: |
          python scripts/verify_sync_release.py

      - name: Publish Sync Health Summary to Actions
        if: always()
        run: |
          if [ -f exports/sync_health.json ]; then
            python -c "
import json
from pathlib import Path
from cbv.pipeline_health import SyncHealthTracker
data = json.loads(Path('exports/sync_health.json').read_text(encoding='utf-8'))
summary = SyncHealthTracker.generate_github_summary(data, data.get('database_match_count', 0) - data.get('new_matches', 0))
Path('${{ github.step_summary }}').write_text(summary, encoding='utf-8')
"
          fi

      - name: Preserve raw snapshots and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbv-source-archive-${{ github.run_id }}
          path: |
            data/raw/matches/
            logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/cbv.duckdb exports/ docs/ index.html .nojekyll
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada. Repositório já está atualizado."
          else
            git commit -m "chore(sync): atualização diária automatizada CBV [03:00 BRT] [skip ci]"
            git push
          fi
