<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vôlei BR — Central de scout</title>
<style>
__FONT_CSS__
:root {
  --bg:#F7F7F5; --surface:#FFFFFF; --surface-alt:#F1F2EE;
  --text:#171717; --text-soft:#4F4F4B; --text-muted:#73736E;
  --border:#DDDDD7; --border-strong:#C8C8C0;
  --primary:#1F4B6E; --primary-soft:#E8F0F6;
  --success:#2F6A4F; --success-soft:#E5EFE9;
  --danger:#A3483C; --danger-soft:#F2E2DE;
  --warning:#8A621F; --warning-soft:#F3E8D3;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}
a{color:var(--primary);text-underline-offset:3px}button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-weight:500}button:hover{background:var(--surface-alt)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
button.primary{background:var(--primary);color:var(--surface);border-color:var(--primary)}
.sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;z-index:20;display:flex;flex-direction:column}
.brand{font-size:20px;font-weight:700;padding:0 12px 24px;text-decoration:none;color:var(--text)}
#primary{display:flex;flex-direction:column;gap:4px}#primary button{border:0;text-align:left;background:transparent;padding:11px 12px;font-weight:500;border-radius:6px}#primary button:hover{background:var(--surface-alt)}#primary button[aria-current=page]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.sidebar-bottom{margin-top:auto;padding:24px 12px 0;color:var(--text-muted);font-size:12px}
.workspace{margin-left:232px;min-width:0}.topbar{height:64px;position:sticky;top:0;z-index:10;display:flex;gap:16px;align-items:center;padding:10px 32px;background:var(--surface);border-bottom:1px solid var(--border)}
.filters{display:flex;gap:12px;min-width:0;flex:1}.filters label{min-width:90px}.filters label:first-child{min-width:140px}.filters select{max-width:240px;padding:5px 28px 5px 8px;min-height:32px;font-size:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--text-soft)}input,select{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;min-height:38px;padding:8px 10px}input::placeholder{color:var(--text-muted)}
.global-search{width:210px;position:relative}.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto;z-index:30}.search-results[hidden]{display:none}.search-results button{display:block;width:100%;text-align:left;border:0;border-radius:0;font-size:12px;padding:10px}.search-results p{padding:10px;margin:0;font-size:12px}
.updated{font-size:11px;color:var(--text-muted);white-space:nowrap}.menu-toggle{display:none}
main{max-width:1400px;padding:32px;margin:auto;min-height:calc(100vh - 140px)}h1{font-size:24px;line-height:1.3;margin:0 0 6px;font-weight:700}h2{font-size:17px;line-height:1.4;margin:0 0 16px;font-weight:600}h3{font-size:15px;line-height:1.4;margin:0 0 12px;font-weight:600}p{margin:0 0 12px}.muted,.note,small{color:var(--text-muted)}.note{font-size:12px}.page-heading{margin-bottom:24px}.page-heading p{color:var(--text-muted);font-size:13px;margin:0}.section-heading{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.section-heading h2{margin:0}.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:none;padding:18px;min-width:0}.block{margin-top:32px}.large-section{margin-top:48px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-12{grid-column:1/-1}.grid>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-bottom:32px}.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{position:relative}.kpi-label{font-size:13px;color:var(--text-soft);font-weight:500;display:block;padding-right:24px}.kpi strong{font-family:'Roboto Mono',monospace;font-size:26px;line-height:1.3;display:block;margin:8px 0 5px;font-weight:500}.kpi p{font-size:12px;color:var(--text-muted);margin:0}.metric-info{display:inline-block;position:relative;font-size:12px;vertical-align:middle}.metric-info summary{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid var(--border-strong);color:var(--text-muted);border-radius:50%;font:12px Inter,Arial,sans-serif;list-style:none}.metric-info summary::-webkit-details-marker{display:none}.kpi>.metric-info{position:absolute;right:14px;top:16px}.metric-info[open]{z-index:8}.info-body{position:absolute;right:0;top:25px;width:290px;padding:14px;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;color:var(--text-soft);font-size:12px;font-family:Inter,Arial,sans-serif;font-weight:400;line-height:1.6;text-align:left}.info-body p:last-child{margin:0}.badge{display:inline-block;font:500 11px Inter,Arial,sans-serif;color:var(--text-soft);background:var(--surface-alt);border-radius:3px;padding:2px 5px}.badge.model{color:var(--primary);background:var(--primary-soft)}
.table-wrap{max-width:100%;overflow:auto;max-height:620px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}th{position:sticky;top:0;z-index:1;background:var(--surface-alt);color:var(--text-soft);font-weight:500;white-space:nowrap}th.num,td.num{text-align:right}td.numeric,.numeric{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px}td.nowrap{white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--primary-soft)}th button{padding:0;border:0;background:transparent;font-size:12px;white-space:nowrap;text-align:inherit}th button:hover{background:transparent;color:var(--primary)}.team-link,.text-button{padding:0;border:0;background:transparent;color:var(--primary);font-weight:500;text-align:left;text-decoration:none}.team-link:hover,.text-button:hover{background:transparent;text-decoration:underline}.team-link{font-size:12px}.rank-list{padding:0;margin:0;list-style:none}.rank-list li{display:flex;align-items:center;gap:12px;padding:8px 0}.rank-list .place{width:14px;font-size:12px;color:var(--text-muted)}.rank-list .team-link{flex:1}.rank-list .numeric{white-space:nowrap}.ranking+.ranking{margin-top:24px}
.chart-scroll{max-width:100%;overflow-x:auto}.chart{display:block;width:100%;height:auto}svg text{font-family:Inter,Arial,sans-serif;fill:var(--text-soft);font-size:12px}svg .team-point{fill:var(--primary);stroke:var(--surface);stroke-width:2;cursor:pointer}svg .team-point:hover{stroke:var(--text);stroke-width:3}.chart-key{font-size:12px;color:var(--text-muted);margin:12px 0 0}.plot-tooltip{position:fixed;pointer-events:none;max-width:280px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px;z-index:50}.plot-tooltip[hidden]{display:none}
.toolbar{display:flex;gap:16px;align-items:end;margin-bottom:24px}.toolbar label{flex:1;max-width:420px}.toolbar.narrow{margin-bottom:16px}.vs{align-self:center;color:var(--text-muted)}.select-prompt{padding:32px;color:var(--text-muted);text-align:center}.team-head{margin:24px 0}.subnav{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);overflow:auto}.subnav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;white-space:nowrap}.subnav button[aria-current=page]{border-color:var(--primary);color:var(--primary)}
.profile-row{margin-top:16px}.bar-label{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:6px}.bar-track{position:relative;height:12px;background:var(--surface-alt);border-radius:2px}.bar-fill{position:absolute;top:2px;bottom:2px;background:var(--primary);border-radius:1px}.bar-marker{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--text)}.summary-list{margin:0;padding:0;list-style:none}.summary-list li{padding:10px 0;font-size:13px}.summary-list span{color:var(--text-muted);display:block;font-size:12px;margin-bottom:3px}.rotations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.rotation h3{margin-bottom:14px}.rotation dl{display:grid;grid-template-columns:1fr auto;gap:6px;margin:0 0 12px;font-size:12px}.rotation dt{color:var(--text-soft)}.rotation dd{margin:0;font-family:'Roboto Mono',monospace;font-size:13px}.sample-warning{color:var(--warning);background:var(--warning-soft);padding:3px 6px;border-radius:3px;font:11px Inter,Arial,sans-serif}.notice{color:var(--warning);font-size:12px;padding:10px 12px;background:var(--warning-soft);border-radius:6px;margin:16px 0}.positive{color:var(--success)}.negative{color:var(--danger)}.details-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-top:24px}.details-panel>summary{font-weight:500;color:var(--primary)}.details-panel[open]>summary{margin-bottom:18px}.details-panel details:not(.metric-info){margin-top:16px}.probabilities{max-width:480px}.prob-row{display:flex;justify-content:space-between;gap:16px;margin:12px 0}.prob-row strong{font:500 22px 'Roboto Mono',monospace}.data-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;font-size:13px;margin:0}.data-list dt{color:var(--text-muted)}.data-list dd{margin:0}.empty{padding:24px 0;color:var(--text-muted);font-size:13px}.footer{padding:16px 32px 24px;font-size:11px;color:var(--text-muted)}.footer span{display:block}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1250px){.topbar{gap:12px;padding:10px 24px}.global-search{width:180px}.updated{font-size:10px}.filters label:first-child{min-width:120px}}
@media(max-width:1100px){.span-8,.span-4{grid-column:1/-1}.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{height:auto;min-height:64px;flex-wrap:wrap}.filters{flex:1 1 100%}.global-search{flex:1}.updated{display:block}}
@media(max-width:900px){.sidebar{display:none;top:60px;width:232px;border-top:1px solid var(--border)}.sidebar.open{display:flex}.workspace{margin-left:0}.topbar{position:relative;padding:12px 24px}.menu-toggle{display:block;position:absolute;left:24px;top:12px}.filters{margin-top:44px}.global-search{min-width:180px}.updated{position:absolute;top:23px;right:24px;margin:0}main{padding:24px}.footer{padding:16px 24px}.rotations{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.topbar{padding:12px 18px;gap:12px}.menu-toggle{left:18px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.filters label:first-child{grid-column:1/-1}.filters select{max-width:none}.filters label{min-width:0}.updated{font-size:10px;right:18px}.global-search{flex-basis:100%}main{padding:24px 18px}.footer{padding:16px 18px}.kpis,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kpis>.kpi:last-child{grid-column:1/-1}.kpis.four>.kpi:last-child{grid-column:auto}.kpi strong{font-size:24px}.kpis{margin-bottom:24px}.grid{gap:24px}.block{margin-top:24px}.large-section{margin-top:32px}.toolbar{flex-direction:column;align-items:stretch;gap:12px}.toolbar label{max-width:none}.vs{display:none}.rotations{grid-template-columns:1fr}.data-list{grid-template-columns:1fr 1fr;gap:12px}.card{padding:16px}.info-body{width:260px}.chart.scatter{min-height:360px}.chart.scatter text{font-size:14px}table{min-width:560px}h1{font-size:22px}.section-heading{align-items:start}.section-heading{gap:8px}.rank-list .team-link{max-width:200px}.data-list dd{overflow-wrap:anywhere}}
@media print{.sidebar,.topbar,.toolbar,.footer{display:none}.workspace{margin:0}main{max-width:none;padding:0}.card{break-inside:avoid}.table-wrap{overflow:visible;max-height:none}.details-panel:not([open]){display:none}}
</style></head>
<body>
<a class="sr-only" href="#main">Ir para o conteúdo</a>
<aside class="sidebar" id="sidebar"><a class="brand" href="#">Vôlei BR</a><nav id="primary" aria-label="Navegação principal"></nav><div class="sidebar-bottom">Central de scout</div></aside>
<div class="workspace"><header class="topbar">
<button class="menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">Menu</button>
<div class="filters"><label>Competição<select id="competition" aria-label="Competição"></select></label><label>Gênero<select id="gender" aria-label="Gênero"></select></label><label>Temporada<select id="season" aria-label="Temporada"></select></label></div>
<div class="global-search"><label for="team-search" class="sr-only">Buscar equipe</label><input id="team-search" placeholder="Buscar equipe" autocomplete="off" aria-controls="team-results" aria-expanded="false"><div id="team-results" class="search-results" hidden></div></div>
<span id="updated" class="updated"></span></header>
<main id="main" tabindex="-1"></main>
<footer class="footer"><span>Projeto independente • dados públicos disponibilizados pela CBV</span><span id="edition"></span></footer></div>
<div id="plot-tooltip" class="plot-tooltip" role="tooltip" hidden></div>
<script type="application/json" id="dataset">__SCOUTING_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent);
const state={page:'Visão geral',sub:'',cohort:0,team:'',opponent:'',query:'',athleteQuery:'',athleteSort:'points',athleteDirection:-1,matchId:null};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=1)=>v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null?'—':fmt(v)+'%';const num=v=>fmt(v,0);const C=()=>DATA.cohorts[state.cohort];const team=()=>C()?.teams.find(t=>t.team===state.team);
const badge=(cls='DERIVADO')=>`<span class="badge ${cls==='MODELO'?'model':''}">${cls}</span>`;
function options(values,current){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
const compKey=c=>c.competition+' · '+(c.category||'Sem categoria');
function filters(){
  const c=C();
  $('#competition').innerHTML=options([...new Set(DATA.cohorts.map(compKey))],compKey(c));
  const comps=DATA.cohorts.filter(x=>compKey(x)===compKey(c));
  $('#gender').innerHTML=options([...new Set(comps.map(x=>x.gender||'Não informado'))],c.gender||'Não informado');
  $('#season').innerHTML=options(comps.filter(x=>x.gender===c.gender).map(x=>x.season),c.season);
  $('#updated').textContent='Atualizado em '+dateText(lastUpdate());
  $('#updated').title='Último registro no banco; não equivale ao horário da coleta na fonte.';
  $('#edition').textContent='Página gerada em '+dateText(DATA.generated_at);
}

function chooseFilter(which,value){const current=C();let candidates=DATA.cohorts.filter(c=>which==='competition'?compKey(c)===value:compKey(c)===compKey(current)&& (which==='gender'?c.gender===value:c.gender===current.gender&&c.season===value));const selected=candidates.find(c=>c.gender===current.gender&&c.season===current.season)||candidates[0];state.cohort=DATA.cohorts.indexOf(selected);state.team='';state.opponent='';state.query='';state.matchId=null;render()}
function table(head,rows,leftColumns=[]){return `<div class="table-wrap"><table><thead><tr>${head.map((h,i)=>`<th scope="col" class="${i&&!leftColumns.includes(i)?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}">Sem dados neste recorte.</td></tr>`}</tbody></table></div>`}
function row(cells,leftColumns=[]){return '<tr>'+cells.map((x,i)=>`<td class="${i&&!leftColumns.includes(i)?'num':''}">${x}</td>`).join('')+'</tr>'}
function teamLink(t){return `<button class="team-link" data-team="${esc(t)}">${esc(teamName(t))}</button>`}

function tooltip(m){
  return `<details class="metric-info"><summary aria-label="Detalhes de ${esc(m.label)}" title="Definição, amostra e intervalo">i</summary><div class="info-body">
    <p><strong>${esc(m.label)}</strong> ${badge(m.metric_class)}</p>
    <p>${esc(m.formula)} × 100.</p>
    <p>Amostra: <span class="numeric">${m.approximate?'≈ ':''}${num(m.numerator)} / ${num(m.n)}</span>. ${m.n>0&&m.n<50?'<span class="sample-warning">Amostra baixa</span>':''} ${m.ci?'IC 95%: '+m.ci.map(v=>fmt(v)).join('–')+'%.':'Intervalo não disponível.'}</p>
    ${m.delta!=null?`<p>Diferença para a competição: ${signed(m.delta)} pp. Percentil: ${fmt(m.percentile,0)}.</p>`:''}
    ${m.adjusted!=null?`<p>Taxa ajustada: ${pct(m.adjusted)} (modelo beta-binomial).</p>`:''}
    <p>${m.approximate?'Contagem aproximada a partir de percentuais arredondados. ':''}Fonte: relatórios CBV · ${esc(seasonLabel(C().season))}. Cobertura: ${num(m.covered_matches)} / ${num(m.total_matches)} registros.</p>
  </div></details>`;
}

function strip(metrics,comparison=false){
  const labels={so:'Side-Out médio',bp:'Break Point médio',eff:'Eficiência de ataque média'};
  return `<div class="kpis">${['so','bp','eff'].map(k=>{
    const m=metrics[k];
    return `<div class="card kpi"><span class="kpi-label">${comparison?esc(m.label):labels[k]}</span>${tooltip(m)}<strong>${pct(m.value)}</strong><p>${comparison&&m.delta!=null?signed(m.delta)+' pp vs competição':'Média da competição'}</p></div>`;
  }).join('')}</div>`;
}

function scatter(){
 const c=C(),points=c.teams.filter(t=>t.metrics.so.value!=null&&t.metrics.bp.value!=null);
 if(!points.length)return '<p class="empty">Sem contagens de SO/BP.</p>';
 const mobile=innerWidth<=600,width=mobile?360:700,left=mobile?68:70,right=mobile?342:640;
 const xs=points.map(t=>t.metrics.so.value),ys=points.map(t=>t.metrics.bp.value);
 const xmin=Math.floor(Math.min(...xs)/5)*5-5,xmax=Math.ceil(Math.max(...xs)/5)*5+5;
 const ymin=Math.floor(Math.min(...ys)/5)*5-5,ymax=Math.ceil(Math.max(...ys)/5)*5+5;
 const X=value=>left+(value-xmin)/(xmax-xmin)*(right-left),Y=value=>330-(value-ymin)/(ymax-ymin)*280;
 let svg=`<svg class="chart scatter" viewBox="0 0 ${width} 410" role="img" aria-label="Side-Out e Break Point por equipe"><title>Side-Out e Break Point por equipe</title>`;
 for(let i=0;i<=4;i++){
   const x=xmin+(xmax-xmin)*i/4,y=ymin+(ymax-ymin)*i/4;
   svg+=`<path d="M${X(x)},50 V330 M${left},${Y(y)} H${right}" stroke="var(--border)" fill="none"/><text x="${X(x)}" y="355" text-anchor="middle">${fmt(x,0)}%</text><text x="${left-12}" y="${Y(y)+4}" text-anchor="end">${fmt(y,0)}%</text>`;
 }
 svg+=`<path d="M${X(c.metrics.so.value)},50 V330 M${left},${Y(c.metrics.bp.value)} H${right}" stroke="var(--text)" stroke-dasharray="5 5" fill="none"/><text x="${(left+right)/2}" y="395" text-anchor="middle">Side-Out %</text><text transform="translate(14,190) rotate(-90)" text-anchor="middle">Break Point %</text>`;
 for(const t of points)svg+=`<g role="button" tabindex="0" data-team="${esc(t.team)}" aria-label="Abrir ${esc(teamName(t.team))}"><title>${esc(teamName(t.team))}: SO ${pct(t.metrics.so.value)}, n=${num(t.metrics.so.n)}; BP ${pct(t.metrics.bp.value)}, n=${num(t.metrics.bp.n)}</title><circle class="team-point" cx="${X(t.metrics.so.value)}" cy="${Y(t.metrics.bp.value)}" r="${mobile?5:6}"/></g>`;
 return svg+'</svg>';
}

function overview(){
  const c=C();
  return heading(competitionLabel()+' '+seasonLabel(c.season),`${c.matches.filter(m=>m.validation_status==='VALID').length} partidas analisadas · atualizado em ${dateText(lastUpdate())}`)
    +strip(c.metrics)
    +`<div class="grid"><section class="card span-8"><h2>Side-Out e Break Point</h2>${scatter()}<p class="chart-key">Linhas tracejadas: média da competição. Selecione uma equipe no gráfico.</p></section>
      <aside class="card span-4">${topRanking('so','Melhores em Side-Out')}${topRanking('bp','Melhores em Break Point')}</aside></div>
      <section class="card block"><div class="section-heading"><h2>Partidas recentes</h2><button class="text-button" data-all-matches>Ver todas as partidas</button></div>${recentMatches()}</section>`;
}

function selectors(two=false){
 const names=C().teams.map(t=>t.team);
 const select=(id,label,current,exclude='')=>`<label>${label}<select id="${id}"><option value="">Selecione uma equipe</option>${names.filter(n=>n!==exclude).map(n=>`<option value="${esc(n)}" ${n===current?'selected':''}>${esc(teamName(n))}</option>`).join('')}</select></label>`;
 return `<div class="toolbar">${select('team',two?'Equipe A':'Equipe',state.team)}${two?'<span class="vs">vs</span>'+select('opponent','Equipe B',state.opponent,state.team):''}</div>`;
}



function phases(t){
 return table(['Contexto','Tentativas','Kill%','Eficiência','Erro%','Bloqueado%'],['pos_rec','neg_rec','trans'].map(k=>row([esc(phaseName(k)),num(t.metrics[k].n),metricCell(t.metrics[k]),metricCell(t.metrics[k+'_eff']),metricCell(t.metrics[k+'_error']),metricCell(t.metrics[k+'_blocked'])])))
   +'<p class="note">Contagens de kills reconstruídas dos percentuais publicados. Detalhes disponíveis em cada taxa.</p>';
}

function rotations(t){
 return `<p class="note">SO e BP por rotação indisponíveis na fonte atual. O saldo é observado nos relatórios.</p>
   <div class="rotations">${t.rotations.map(r=>`<section class="card rotation"><h3>${r.rotation}</h3><dl><dt>SO</dt><dd>—</dd><dt>BP</dt><dd>—</dd><dt>Saldo</dt><dd>${r.covered_matches?(r.observed_balance>0?'+':'')+num(r.observed_balance):'—'}</dd></dl><p class="note">n SO — · n BP —</p><small>${r.covered_matches} relatórios</small></section>`).join('')}</div>`;
}

function athletes(t){
 const query=normalized(state.athleteQuery);
 const list=t.athletes.filter(a=>normalized(a.name).includes(query));
 const value=(a,key)=>({name:a.name,games:a.games??a.metrics.kill.total_matches,points:a.points,attacks:a.metrics.kill.n,kill:a.metrics.kill.value,eff:a.metrics.eff.value,receptions:a.receptions??a.metrics.rec_error.n,positive:a.metrics.positive.value,error:a.metrics.rec_error.value}[key]);
 list.sort((a,b)=>{const av=value(a,state.athleteSort),bv=value(b,state.athleteSort);if(av==null)return bv==null?0:1;if(bv==null)return -1;return state.athleteDirection*(typeof av==='string'?av.localeCompare(bv,'pt-BR'):av-bv)});
 const columns=[['name','Atleta'],['games','Jogos'],['points','Pontos'],['attacks','Ataques'],['kill','Kill%'],['eff','Eficiência'],['receptions','Recepções'],['positive','Passe +'],['error','Erro']];
 const headers=columns.map(([key,title],i)=>`<th scope="col" class="${i?'num':''}" aria-sort="${state.athleteSort===key?(state.athleteDirection===1?'ascending':'descending'):'none'}"><button data-athlete-sort="${key}" title="Ordenar por ${title}">${title}${state.athleteSort===key?(state.athleteDirection===1?' ↑':' ↓'):''}</button></th>`).join('');
 return `<div class="toolbar narrow"><label>Buscar atleta<input id="athlete-search" value="${esc(state.athleteQuery)}" placeholder="Nome do atleta"></label></div><div class="table-wrap"><table id="athlete-table"><thead><tr>${headers}</tr></thead><tbody>${list.map(a=>`<tr><td>${esc(teamName(a.name))}</td><td class="num">${num(value(a,'games'))}</td><td class="num">${num(a.points)}</td><td class="num numeric">${num(a.metrics.kill.n)}</td><td class="num">${metricCell(a.metrics.kill)}</td><td class="num">${metricCell(a.metrics.eff)}</td><td class="num numeric">${num(value(a,'receptions'))}</td><td class="num">${metricCell(a.metrics.positive)}</td><td class="num">${metricCell(a.metrics.rec_error)}</td></tr>`).join('')||'<tr><td colspan="9">Nenhum atleta encontrado.</td></tr>'}</tbody></table></div><p class="note">Erro: taxa de erro de recepção. Jogos: partidas com registro do atleta na fonte.</p>`;
}

function trend(t){const points=t.trend.filter(r=>r.so!=null);if(!points.length)return '<p class="empty">Sem histórico datado suficiente.</p>';const X=i=>55+i/Math.max(1,points.length-1)*590,Y=v=>220-v*2;return `<h3>Tendência de Side-Out</h3><svg class="chart" viewBox="0 0 700 270" role="img" aria-label="Média móvel ponderada dos últimos cinco jogos e média da temporada"><path d="M55,20 V220 H645" fill="none" stroke="var(--border-strong)"/>${[0,25,50,75,100].map(v=>`<text x="45" y="${Y(v)+4}" text-anchor="end">${v}%</text>`).join('')}<path d="M55,${Y(t.metrics.so.value)} H645" stroke="var(--text)" stroke-dasharray="4 4"/><polyline points="${points.map((p,i)=>X(i)+','+Y(p.so)).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2"/>${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.so)}" r="3" fill="var(--primary)"><title>${esc(p.date.slice(0,10))}: ${pct(p.so)}, n=${num(p.n)}</title></circle>`).join('')}<text x="55" y="250">${esc(points[0].date.slice(0,10))}</text><text x="645" y="250" text-anchor="end">${esc(points.at(-1).date.slice(0,10))}</text></svg><p class="note">Linha contínua: razão das contagens dos últimos 5 jogos (ou menos no início). Tracejado: temporada ${pct(t.metrics.so.value)} · n=${num(t.metrics.so.n)}.</p><details><summary>Valores da tendência</summary>${table(['Data','SO móvel · n'],points.map(p=>row([esc(p.date.slice(0,10)),pct(p.so)+' · '+num(p.n)])))}</details>`}
function teams(){
 const t=team();
 const select=selectors();
 if(!t)return heading('Equipes')+select+'<div class="card select-prompt">Selecione uma equipe para ver o perfil, as rotações e os atletas.</div>';
 return select+heading(teamName(t.team),`${competitionLabel()} · ${seasonLabel(C().season)} · ${t.games} jogos · ${t.wins} vitórias · ${t.losses} derrotas`)
   +teamKpis(t)
   +`<div class="grid"><section class="card span-8"><h2>Perfil</h2>${profile(t)}</section><aside class="card span-4"><h2>Resumo</h2>${teamSummary(t)}</aside></div>
    <section class="block"><h2>Rotações</h2>${rotations(t)}</section>
    <section class="card block"><h2>Ataque por fase</h2>${phases(t)}</section>
    <section class="card large-section"><h2>Atletas</h2>${athletes(t)}</section>
    <details class="details-panel"><summary>Últimos jogos e tendência</summary>${trend(t)}</details>`;
}

function model(a,b){
 const c=C(),m=c.model_matchups.find(m=>[m.team_a,m.team_b].includes(a.team)&&[m.team_a,m.team_b].includes(b.team));
 const ev=c.evaluation,p=m?(m.team_a===a.team?m.probability_a:1-m.probability_a):null;
 return `<details class="details-panel" id="projection"><summary>Ver projeção</summary><h2>Probabilidade de vitória ${badge('MODELO')}</h2>
   ${p!=null?`<div class="probabilities"><div class="prob-row"><span>${esc(teamName(a.team))}</span><strong>${pct(100*p)}</strong></div><div class="prob-row"><span>${esc(teamName(b.team))}</span><strong>${pct(100*(1-p))}</strong></div></div>`:'<p class="empty">Histórico insuficiente para este confronto.</p>'}
   <p class="note">Intervalo: ainda não estimado.</p><p class="note">Amostra de avaliação: <span class="numeric">${ev.total_matches}</span> partidas · avaliado em <span class="numeric">${dateText(DATA.generated_at)}</span>.</p>
   ${ev.total_matches===0?'<p class="notice">Modelo ainda sem avaliação fora da amostra neste recorte.</p>':''}
   <details><summary>Detalhes da avaliação</summary>
     <p class="note">Avaliação temporal: usa apenas datas anteriores ao jogo. Jogos do mesmo dia são tratados em conjunto.</p>
     ${table(['Brier Score','Log loss','Erro de calibração','Acurácia'],[row([fmt(ev.brier_score,3),fmt(ev.log_loss,3),fmt(ev.calibration_error,3),pct(ev.accuracy_pct)])])}
     <details><summary>Calibração</summary>${calibration(ev)}${table(['Faixa','Amostra','Probabilidade média','Resultado observado'],Object.entries(ev.calibration).map(([k,v])=>row([esc(k),num(v.pred_count),v.mean_probability==null?'—':pct(100*v.mean_probability),v.observed_frequency==null?'—':pct(100*v.observed_frequency)])))}</details>
     <p class="note">Regressão logística regularizada com dados anteriores de SO, BP, ataque por fase e campanha recente. Não há efeito de mando presumido nem intervalo preditivo validado.</p>
   </details></details>`;
}

function calibration(ev){const bins=Object.values(ev.calibration).filter(b=>b.pred_count);return `<svg class="chart" viewBox="0 0 360 290" role="img" aria-label="Probabilidade média do favorito versus frequência observada"><path d="M45,240 L285,20" stroke="var(--border-strong)" stroke-dasharray="4 4"/><path d="M45,20 V240 H285" stroke="var(--border)" fill="none"/>${bins.map(b=>`<circle cx="${45+b.mean_probability*240}" cy="${240-b.observed_frequency*220}" r="5" fill="var(--primary)"><title>n=${b.pred_count}; prevista ${pct(100*b.mean_probability)}, observada ${pct(100*b.observed_frequency)}</title></circle>`).join('')}<text x="45" y="258">0%</text><text x="280" y="258">100%</text><text x="35" y="25" text-anchor="end">100%</text><text x="170" y="282" text-anchor="middle">Probabilidade média do favorito</text></svg>`}
function confrontation(){
 const a=team(),b=C().teams.find(t=>t.team===state.opponent);
 const top=heading('Selecionar confronto')+selectors(true);
 if(!a||!b)return top+'<div class="card select-prompt">Selecione duas equipes para comparar.</div>';
 const headers=['Métrica',esc(teamName(a.team)),esc(teamName(b.team))];
 const summary=[row(['Campanha',`${a.wins}–${a.losses}`,`${b.wins}–${b.losses}`]),...['so','bp','eff'].map(k=>row([esc(a.metrics[k].label),metricCell(a.metrics[k]),metricCell(b.metrics[k])]))];
 const phaseRows=[['pos_rec','K1+ Kill%'],['pos_rec_eff','K1+ Eff'],['neg_rec','K1− Kill%'],['neg_rec_eff','K1− Eff'],['trans','K2 Kill%'],['trans_eff','K2 Eff']].map(([k,label])=>{const av=a.metrics[k].value,bv=b.metrics[k].value,d=av==null||bv==null?null:av-bv;return row([label,metricCell(a.metrics[k]),metricCell(b.metrics[k]),`<span class="numeric ${d>0?'positive':d<0?'negative':''}">${d==null?'—':signed(d)+' pp'}</span>`])});
 const rotationRows=a.rotations.map((r,i)=>row([r.rotation,pct(r.so),pct(b.rotations[i]?.so),pct(r.bp),pct(b.rotations[i]?.bp)]));
 return top+`<section class="card"><h2>Resumo</h2>${table(headers,summary)}</section>
   <section class="card block"><h2>Ataque por fase</h2>${table([...headers,'Diferença A − B'],phaseRows)}</section>
   <section class="card block"><h2>Rotações</h2>${table(['Rotação','A SO','B SO','A BP','B BP'],rotationRows)}<p class="note">SO e BP por rotação não estão disponíveis na fonte atual.</p></section>`+model(a,b);
}

function matchTable(matches){
 return `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Competição</th><th>Mandante</th><th>Visitante</th><th class="num">Placar</th><th></th></tr></thead><tbody>${matches.map(m=>`<tr><td class="numeric nowrap">${matchDate(m.date||m.match_date)}</td><td>${esc(competitionLabel())}</td><td>${esc(teamName(m.home_team))}</td><td>${esc(teamName(m.away_team))}</td><td class="numeric num nowrap">${m.home_sets==null||m.away_sets==null?'—':`${m.home_sets} × ${m.away_sets}`}</td><td><button class="text-button" data-match="${esc(m.match_id)}" aria-label="Ver partida ${esc(teamName(m.home_team))} contra ${esc(teamName(m.away_team))}">Ver</button></td></tr>`).join('')||'<tr><td colspan="6">Sem partidas neste recorte.</td></tr>'}</tbody></table></div>`;
}

function matchesPage(){
 if(state.matchId!=null)return matchPage();
 const c=C(),completed=new Set(c.matches.map(m=>m.match_id));
 const today=DATA.generated_at.slice(0,10);
 const source=state.sub==='Próximas'?c.upcoming.filter(m=>!completed.has(m.match_id)&&String(m.match_date||'')>=today):[...c.matches].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||b.match_id-a.match_id);
 const matches=source.filter(m=>normalized(`${m.home_team} ${m.away_team} ${m.match_id} ${m.date||m.match_date}`).includes(normalized(state.query)));
 return `<div class="card"><div class="toolbar narrow"><label>Buscar partida<input id="search" value="${esc(state.query)}" placeholder="Equipe, data ou ID"></label></div>${matchTable(matches)}${state.sub==='Próximas'?'<p class="note">Calendário armazenado. Consulte a CBV para alterações de data e horário.</p>':''}</div>`;
}

function dataPage(){
 const c=C(),valid=c.matches.filter(m=>m.validation_status==='VALID').length,warning=c.matches.filter(m=>m.validation_status==='WARNING').length;
 const error=c.matches.length-valid-warning;
 const metricKeys=['so','bp','kill','eff','positive','excellent','error','rec_error','pos_rec','pos_rec_eff','neg_rec','neg_rec_eff','trans','trans_eff'];
 const parser=[...new Set(c.matches.map(m=>m.provenance?.parser_version).filter(Boolean))];
 const fetched=c.matches.map(m=>m.provenance?.fetched_at).filter(Boolean).sort().at(-1);
 return heading('Dados')+`<section class="card"><h2>Cobertura</h2><dl class="data-list"><dt>Partidas coletadas</dt><dd>${c.matches.length}</dd><dt>Partidas validadas</dt><dd>${valid}</dd><dt>Partidas com erro</dt><dd>${error}</dd><dt>Partidas com ressalvas</dt><dd>${warning}</dd><dt>Competições na base</dt><dd>${[...new Set(DATA.cohorts.map(x=>x.competition))].map(x=>x==='SUPERLIGA'?'Superliga':x).join(', ')}</dd><dt>Último registro no banco</dt><dd class="numeric">${dateText(lastUpdate())}</dd></dl><p class="note block">Indicadores incluem apenas partidas validadas do recorte selecionado.</p></section>
 <section class="card block"><h2>Métricas</h2>${table(['Métrica','Definição','Tipo'],[row(['Pontos de ataque','Contagem de ataques que terminam em ponto.',badge('OBSERVADO')],[1,2]),row(['Aces','Pontos diretos de saque registrados no relatório.',badge('OBSERVADO')],[1,2]),...metricKeys.map(k=>{const m=c.metrics[k];return row([esc(m.label),esc(m.formula),badge(m.metric_class)],[1,2])}),row(['Probabilidade de vitória','Estimativa do modelo a partir do histórico anterior de partidas.',badge('MODELO')],[1,2])],[1,2])}
 <details class="block"><summary>Qualidade dos dados e detalhes estatísticos</summary><p class="note">Partidas sem data: ${c.matches.filter(m=>!m.date).length}. Falhas de download sem registro não são contabilizadas.</p>${table(['Métrica','Registros disponíveis','Amostra'],metricKeys.map(k=>{const m=c.metrics[k];return row([esc(m.label),`${m.covered_matches} / ${m.total_matches}`,num(m.n)])}))}<p class="note">Percentuais de passe e kills por fase podem ser reconstruídos de valores arredondados da fonte. Intervalos e ajustes ficam indisponíveis quando faltam contagens adequadas.</p><p class="note">Wilson 95%, deltas, percentis, ajuste beta-binomial e validação temporal permanecem nos cálculos. Consulte o detalhe de cada indicador para amostra e intervalo. Os rótulos de amostra são apenas orientações de leitura.</p><p class="note">SO/BP por rotação e métricas de sequência exigem eventos por rally, ausentes da base atual.</p></details></section>
 <section class="card block"><h2>Atualização</h2><dl class="data-list"><dt>Versão do banco</dt><dd>${esc(DATA.data_version)}</dd><dt>Parser</dt><dd>${esc(parser.join(', ')||'Não registrado no legado')}</dd><dt>Última coleta na fonte</dt><dd class="numeric">${dateText(fetched)}</dd><dt>Página gerada em</dt><dd class="numeric">${dateText(DATA.generated_at)}</dd></dl>
 <details class="block"><summary>Atualizar dados</summary><label>URL da competição<input id="sync-url" type="url" placeholder="https://cbv.com.br/..."></label><p class="block"><button id="sync">Sincronizar dados</button> <button id="export">Exportar dados</button></p><p id="operation-status" role="status"></p><p class="note">Disponível no servidor local. No site, a coleta é executada pela rotina diária.</p></details></section>
 <details class="details-panel"><summary>Experimental</summary><h2>Distribuição estimada ${badge('MODELO')}</h2><p>Estimativa baseada no modelo atual. Não representa frequência observada de levantamentos.</p><p class="note">Disponível na área experimental do servidor local.</p><a href="http://127.0.0.1:8000/experimental" target="_blank" rel="noopener">Abrir distribuição estimada</a></details>`;
}

function dateText(value){return value?new Date(value).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}):'não registrado'}
function lastUpdate(){return C().matches.map(m=>m.created_at).filter(Boolean).sort().at(-1)}
function seasonLabel(value){return String(value||'').replace(/(\d{4})-(\d{2})(\d{2})/,'$1–$3')}
function competitionLabel(c=C()){return (c.competition==='SUPERLIGA'?'Superliga':c.competition+' '+String(c.category||'').replace('sub','Sub-'))+' '+(c.gender==='feminino'?'Feminina':'Masculina')}
function heading(title,subtitle=''){return `<div class="page-heading"><h1>${esc(title)}</h1>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div>`}
function closeMenu(){ $('#sidebar').classList.remove('open'); $('#menu-toggle').setAttribute('aria-expanded','false') }
function openTeam(name){state.team=name;state.page='Equipes';state.sub='';state.athleteQuery='';closeMenu();render();$('#main').focus()}
function globalSearch(){
 const input=$('#team-search'),results=$('#team-results');const query=input.value.trim().toLocaleLowerCase('pt-BR');
 const found=query?C().teams.filter(t=>t.team.toLocaleLowerCase('pt-BR').includes(query)).slice(0,8):[];
 results.innerHTML=found.map(t=>`<button type="button" data-search-team="${esc(t.team)}">${esc(t.team)}</button>`).join('')||(query?'<p>Nenhuma equipe encontrada.</p>':'');
 results.hidden=!query;input.setAttribute('aria-expanded',String(!results.hidden));
 results.querySelectorAll('button').forEach(button=>button.onclick=()=>{input.value='';results.hidden=true;input.setAttribute('aria-expanded','false');openTeam(button.dataset.searchTeam)});
}
function signed(value){return value==null?'—':(value>0?'+':'')+fmt(value)}
function matchDate(value){const date=String(value||'').slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(date)?date.split('-').reverse().join('/'):'Sem data'}
function topRanking(key,title){
  const items=C().teams.filter(t=>t.metrics[key].value!=null).sort((a,b)=>b.metrics[key].value-a.metrics[key].value).slice(0,5);
  return `<section class="ranking"><h2>${esc(title)}</h2><ol class="rank-list">${items.map((t,i)=>`<li><span class="place">${i+1}.</span>${teamLink(t.team)}<span class="numeric" title="n=${num(t.metrics[key].n)}">${pct(t.metrics[key].value)}</span></li>`).join('')}</ol></section>`;
}
function recentMatches(){
  const matches=[...C().matches].filter(m=>m.home_sets!=null&&m.away_sets!=null).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||b.match_id-a.match_id).slice(0,5);
  return `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Mandante</th><th>Visitante</th><th class="num">Placar</th></tr></thead><tbody>${matches.map(m=>`<tr><td class="numeric nowrap">${matchDate(m.date)}</td><td>${teamLink(m.home_team)}</td><td>${teamLink(m.away_team)}</td><td class="numeric num nowrap">${m.home_sets} × ${m.away_sets}</td></tr>`).join('')||'<tr><td colspan="4">Sem partidas encerradas.</td></tr>'}</tbody></table></div>`;
}
function teamName(value){const keep=new Set(['SESI','SESC','RJ','MG','SP','E.C.']);return String(value||'').split(/\s+/).map((word,i)=>keep.has(word)?word:(!i||!['de','da','do','e','dos','das'].includes(word.toLowerCase())?word.charAt(0).toUpperCase()+word.slice(1).toLowerCase():word.toLowerCase())).join(' ')}
function normalized(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR')}
function phaseName(key){return {pos_rec:'K1 com passe positivo',neg_rec:'K1 fora do sistema',trans:'K2 / transição'}[key]||key}
function metricTitle(m){return `${m.label}: ${m.formula} × 100. n=${num(m.n)}; ${m.ci?'IC 95% '+m.ci.map(v=>fmt(v)).join('–')+'%; ':''}${m.approximate?'Contagem aproximada. ':''}Fonte: CBV · ${C().season}. Tipo: ${m.metric_class}.`}
function metricCell(m,showN=false){return `<span class="numeric" title="${esc(metricTitle(m))}">${pct(m.value)}${showN?' · '+num(m.n):''}</span>`}
function teamKpis(t){return `<div class="kpis four"><div class="card kpi"><span class="kpi-label">Campanha</span><strong style="font-family:Inter,Arial,sans-serif">${t.wins}–${t.losses}</strong><p>${t.games} jogos</p></div>${['so','bp','eff'].map(k=>{const m=t.metrics[k];return `<div class="card kpi"><span class="kpi-label">${esc(m.label)}</span>${tooltip(m)}<strong>${pct(m.value)}</strong><p>${m.delta==null?'Sem comparação':signed(m.delta)+' pp vs competição'} · <span class="numeric">n=${num(m.n)}</span></p></div>`}).join('')}</div>`}
function profile(t){
 const labels={so:'Side-Out',bp:'Break Point',pos_rec:'K1 com passe positivo',neg_rec:'K1 fora do sistema',trans:'K2 / transição',eff:'Eficiência de ataque'};
 const minimum=t.metrics.eff.value<0||C().metrics.eff.value<0?-100:0;
 const position=v=>Math.max(0,Math.min(100,100*(v-minimum)/(100-minimum))),zero=position(0);
 return Object.entries(labels).map(([key,label])=>{const m=t.metrics[key],average=C().metrics[key].value,end=position(m.value??0);return `<div class="profile-row"><div class="bar-label"><span>${label}</span><span title="${esc(metricTitle(m))}" class="numeric">${pct(m.value)}</span></div><div class="bar-track" role="img" aria-label="${esc(label)}: equipe ${pct(m.value)}, média da competição ${pct(average)}">${m.value!=null?`<span class="bar-fill" style="left:${Math.min(zero,end)}%;width:${Math.abs(end-zero)}%"></span>`:''}${average!=null?`<span class="bar-marker" style="left:${position(average)}%"></span>`:''}</div></div>`}).join('')+`<p class="chart-key">Barra: equipe · marca vertical: média da competição. Escala: ${minimum} a 100%.</p>`;
}
function teamSummary(t){
 const phases=['pos_rec_eff','neg_rec_eff','trans_eff'].map(k=>({key:k,value:t.metrics[k].value})).filter(m=>m.value!=null).sort((a,b)=>b.value-a.value);
 const rotations=t.rotations.filter(r=>r.covered_matches>0).sort((a,b)=>b.observed_balance-a.observed_balance);
 const phase=m=>m?phaseName(m.key.replace('_eff','')):'Sem dados';
 return `<ul class="summary-list"><li><span>Melhor fase</span>${esc(phase(phases[0]))}</li><li><span>Maior dificuldade</span>${esc(phase(phases.at(-1)))}</li><li><span>Melhor rotação por saldo</span>${rotations[0]?.rotation||'Sem dados'}</li><li><span>Rotação mais fraca por saldo</span>${rotations.at(-1)?.rotation||'Sem dados'}</li></ul><details><summary class="note">Como o resumo é calculado</summary><p class="note">Fases: maior/menor eficiência observada. Rotações: maior/menor saldo acumulado, sem ajuste por exposição. Em empate, exibe a primeira posição; não implica superioridade.</p></details>`;
}
function restoreInput(id,key,event){state[key]=event.target.value;const position=event.target.selectionStart;render();const input=$('#'+id);input.focus();input.setSelectionRange(position,position)}

function detailMetrics(source){return Object.fromEntries(Object.entries(source||{}).map(([key,m])=>[key,{...C().metrics[key],...m,delta:null,adjusted:null,percentile:null,covered_matches:m.n?1:0,total_matches:1}]))}
function matchPage(){
 const c=C(),m=c.matches.find(m=>String(m.match_id)===String(state.matchId))||c.upcoming.find(m=>String(m.match_id)===String(state.matchId));
 if(!m)return heading('Partida não encontrada')+'<button data-back-matches>Voltar para partidas</button>';
 const detail=c.match_details?.[String(m.match_id)],a=detail?.teams[m.home_team],b=detail?.teams[m.away_team];
 const am=detailMetrics(a?.metrics),bm=detailMetrics(b?.metrics);
 const title=`${teamName(m.home_team)} ${m.home_sets==null?'×':m.home_sets+' × '+m.away_sets} ${teamName(m.away_team)}`;
 const top=`<p><button class="text-button" data-back-matches>Voltar para partidas</button></p>`+heading(title,matchDate(m.date||m.match_date)+' · '+competitionLabel());
 if(!detail||!a||!b)return top+'<div class="card"><p>Estatísticas ainda não disponíveis.</p><a href="https://cbv.com.br/jogo/'+encodeURIComponent(m.match_id)+'" target="_blank" rel="noopener">Ver na CBV</a></div>';
 const headers=['Métrica',esc(teamName(m.home_team)),esc(teamName(m.away_team))];
 const overviewRows=[...['so','bp','eff'].map(k=>row([esc(am[k].label),metricCell(am[k]),metricCell(bm[k])])),row(['Aces',num(a.aces),num(b.aces)]),row(['Erros de saque',num(a.serve_errors),num(b.serve_errors)]),row(['Bloqueios',num(a.blocks),num(b.blocks)])];
 const phaseRows=[['pos_rec','K1+ Kill%'],['pos_rec_eff','K1+ Eff'],['neg_rec','K1− Kill%'],['neg_rec_eff','K1− Eff'],['trans','K2 Kill%'],['trans_eff','K2 Eff']].map(([k,label])=>row([label,metricCell(am[k]),metricCell(bm[k])]));
 const playerRows=detail.players.map(p=>{const mm=detailMetrics(p.metrics);return row([esc(teamName(p.name)),esc(teamName(p.team)),num(p.points),num(mm.kill.n),metricCell(mm.kill),metricCell(mm.eff),num(p.receptions),metricCell(mm.positive),metricCell(mm.rec_error)],[1])});
 return top+`${m.validation_status!=='VALID'?'<p class="notice">Partida com ressalvas de validação. Os registros abaixo não entram nos indicadores consolidados.</p>':''}
 <section class="card"><h2>Comparação geral</h2>${table(headers,overviewRows)}</section>
 <section class="card block"><h2>Sets</h2>${table(['Set',esc(teamName(m.home_team)),esc(teamName(m.away_team))],detail.sets.map(s=>row([num(s.set_number),num(s.home_points),num(s.away_points)])))}</section>
 <section class="card block"><h2>Ataque por fase</h2>${table(headers,phaseRows)}</section>
 <section class="card block"><h2>Atletas</h2>${table(['Atleta','Equipe','Pontos','Ataques','Kill%','Eficiência','Recepções','Passe +','Erro'],playerRows)}</section>
 <section class="card block"><h2>Rotações</h2>${table(['Rotação','Saldo mandante','Saldo visitante'],a.rotations.map((value,i)=>row(['P'+(i+1),value==null?'—':(value>0?'+':'')+num(value),b.rotations[i]==null?'—':(b.rotations[i]>0?'+':'')+num(b.rotations[i])])))}<p class="note">SO e BP por rotação não disponíveis na fonte.</p></section>
 <p class="block"><a href="https://cbv.com.br/jogo/${encodeURIComponent(m.match_id)}" target="_blank" rel="noopener">Ver súmula e relatório na CBV</a></p>`;
}
function render(){
 if(!DATA.cohorts.length){$('#main').innerHTML=heading('Sem partidas disponíveis');return}
 const c=C();
 if(state.team&&!c.teams.some(t=>t.team===state.team))state.team='';
 if(state.opponent===state.team||!c.teams.some(t=>t.team===state.opponent))state.opponent='';
 filters();
 $('#primary').innerHTML=['Visão geral','Equipes','Confrontos','Partidas','Dados'].map(page=>`<button data-page="${page}" ${page===state.page?'aria-current="page"':''}>${page}</button>`).join('');
 const tabs=state.page==='Partidas'&&state.matchId==null?['Próximas','Encerradas','Súmulas']:[];
 if(tabs.length&&!tabs.includes(state.sub))state.sub=tabs[0];
 const subnav=tabs.length?`<nav class="subnav" aria-label="Listas de partidas">${tabs.map(tab=>`<button data-sub="${tab}" ${tab===state.sub?'aria-current="page"':''}>${tab}</button>`).join('')}</nav>`:'';
 const page={'Visão geral':overview,Equipes:teams,Confrontos:confrontation,Partidas:matchesPage,Dados:dataPage}[state.page];
 $('#main').innerHTML=(tabs.length?heading('Partidas')+subnav:'')+page();
 bind();
}

function bind(){
 document.querySelectorAll('#main svg.chart').forEach(svg=>{
   const box=document.createElement('div');box.className='chart-scroll';box.tabIndex=0;
   box.setAttribute('role','region');box.setAttribute('aria-label',svg.getAttribute('aria-label')+' · rolagem horizontal em telas pequenas');
   svg.before(box);box.append(svg);
 });
 document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{
   state.page=button.dataset.page;state.sub='';state.matchId=null;closeMenu();render();window.scrollTo(0,0);
 });
 document.querySelectorAll('[data-sub]').forEach(button=>button.onclick=()=>{state.sub=button.dataset.sub;state.query='';render()});
 document.querySelectorAll('[data-team]').forEach(element=>{
   if(element.tagName.toLowerCase()==='g'){
     const title=element.querySelector('title')?.textContent||teamName(element.dataset.team),tip=$('#plot-tooltip');
     const show=event=>{tip.textContent=title;tip.hidden=false;const rect=element.getBoundingClientRect();tip.style.left=Math.max(12,Math.min((event?.clientX||rect.left)+12,innerWidth-290))+'px';tip.style.top=Math.max(12,Math.min((event?.clientY||rect.top)+12,innerHeight-90))+'px'};
     element.onmouseenter=show;element.onmousemove=show;element.onfocus=show;
     element.onmouseleave=()=>{tip.hidden=true};element.onblur=()=>{tip.hidden=true};
   }
   const go=()=>{$('#plot-tooltip').hidden=true;openTeam(element.dataset.team);window.scrollTo(0,0)};
   element.onclick=go;element.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();go()}};
 });
 for(const [id,key] of [['team','team'],['opponent','opponent']])if($('#'+id))$('#'+id).onchange=event=>{state[key]=event.target.value;state.athleteQuery='';render()};
 if($('#athlete-search'))$('#athlete-search').oninput=event=>restoreInput('athlete-search','athleteQuery',event);
 document.querySelectorAll('[data-athlete-sort]').forEach(button=>button.onclick=()=>{
   const key=button.dataset.athleteSort;state.athleteDirection=state.athleteSort===key?-state.athleteDirection:(key==='name'?1:-1);state.athleteSort=key;render();
 });
 if($('#search'))$('#search').oninput=event=>restoreInput('search','query',event);
 document.querySelectorAll('[data-match]').forEach(button=>button.onclick=()=>{state.matchId=button.dataset.match;state.page='Partidas';render();window.scrollTo(0,0);$('#main').focus()});
 if($('[data-back-matches]'))$('[data-back-matches]').onclick=()=>{state.matchId=null;state.sub='Encerradas';render()};
 if($('[data-all-matches]'))$('[data-all-matches]').onclick=()=>{state.page='Partidas';state.sub='Encerradas';state.matchId=null;render();window.scrollTo(0,0)};
 if($('#sync'))$('#sync').onclick=()=>operation('/api/sync',{url:$('#sync-url').value||null},true);
 if($('#export'))$('#export').onclick=()=>operation('/api/export-all',{},false);
 // Only one statistical popover is open at a time; the full content remains keyboard accessible.
 document.querySelectorAll('.metric-info').forEach(detail=>detail.addEventListener('toggle',()=>{if(detail.open)document.querySelectorAll('.metric-info[open]').forEach(other=>{if(other!==detail)other.open=false})}));
}

async function operation(url,body,reload){const status=$('#operation-status');if(!['localhost','127.0.0.1'].includes(location.hostname)){status.textContent='Esta operação requer o servidor local: python -m cbv app';return}status.textContent='Processando…';try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await res.json();if(!res.ok)throw new Error(result.detail||'Falha na operação');status.textContent=result.message||'Concluído.';if(reload)location.reload()}catch(e){status.textContent=e.message}}
matchMedia('(max-width:600px)').addEventListener('change',()=>{if(state.page==='Visão geral')render()});
$('#menu-toggle').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',String(open))};
$('#team-search').oninput=globalSearch;
$('#team-search').onkeydown=e=>{if(e.key==='Escape'){$('#team-results').hidden=true;e.target.setAttribute('aria-expanded','false')}if(e.key==='ArrowDown'){$('#team-results button')?.focus();e.preventDefault()}if(e.key==='Enter'){const first=$('#team-results button');if(first){first.click();e.preventDefault()}}};
document.addEventListener('click',e=>{if(!e.target.closest('.global-search')){$('#team-results').hidden=true;$('#team-search').setAttribute('aria-expanded','false')}});
for(const id of ['competition','gender','season'])$('#'+id).onchange=e=>chooseFilter(id,e.target.value);
render();
</script></body></html>
