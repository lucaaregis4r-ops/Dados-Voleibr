<style>
__FONT_CSS__
:root{--paper:#F2EFE7;--paper-raised:#FAF8F2;--ink:#171717;--ink-soft:#45443F;--muted:#74716A;--rule:#CDC8BD;--rule-strong:#A9A399;--brand:#244C66;--brand-soft:#DDE7EC;--positive:#3F6B58;--positive-soft:#E0EAE4;--negative:#B94B3D;--negative-soft:#F1DFDA;--attention:#8A5D1B;--attention-soft:#F2E6CB;--model:#705A86;--model-soft:#E9E2EE}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Archivo,Arial,sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button,a,select,input{outline-offset:4px}a{color:var(--brand)}button{border:1px solid var(--rule);background:transparent;padding:9px 14px}button:hover{background:var(--brand-soft)}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--brand)}.wrap{max-width:1440px;padding:0 48px;margin:auto}.masthead{display:grid;grid-template-columns:7fr 5fr;gap:24px;align-items:end;padding:36px 0 28px;border-bottom:2px solid var(--ink)}.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.wordmark{display:flex;align-items:center;gap:10px;margin-bottom:24px}.mark{width:24px;height:24px;background:var(--brand);display:inline-block;clip-path:polygon(0 0,100% 0,100% 35%,35% 100%,0 100%)}h1{font-size:40px;line-height:1.05;font-weight:700;margin:0 0 12px}h2{font-size:28px;line-height:1.15;margin:0 0 12px}h3{font-size:20px;line-height:1.25;margin:0 0 16px}p{margin:0 0 16px}.muted,small{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{font-size:13px;display:block}select,input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule-strong);padding:10px 0;border-radius:0}nav{display:flex;gap:30px;border-bottom:1px solid var(--rule);padding-top:8px}nav button{border:0;padding:15px 0;border-bottom:2px solid transparent}nav button[aria-current=page]{border-color:var(--brand);color:var(--brand);font-weight:700}.subnav{gap:24px;padding-top:0;margin-bottom:28px}.subnav button{font-size:13px}main{min-height:65vh;padding:32px 0 64px}.lead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:24px}.badge{display:inline-block;border:1px solid var(--rule-strong);padding:2px 5px;font:10px/1.4 'IBM Plex Mono',monospace;white-space:nowrap;vertical-align:middle}.badge.model{background:var(--model-soft);color:var(--model);border-color:var(--model)}.note{font-size:13px;color:var(--ink-soft)}.notice{padding:16px 0 16px 16px;border-left:3px solid var(--attention);color:var(--attention);font-size:13px;margin:18px 0}.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:24px 0 40px}.kpi{padding:22px 18px;border-right:1px solid var(--rule);min-width:0}.kpi:first-child{padding-left:0}.kpi:last-child{border:0}.kpi strong{display:block;font-size:36px;line-height:1.1;font-weight:800;margin:12px 0 8px}.kpi .details{font:11px/1.8 'IBM Plex Mono',monospace;color:var(--ink-soft)}details{font-size:12px}summary{cursor:pointer;color:var(--brand)}.editorial>*{min-width:0}.editorial{display:grid;grid-template-columns:8fr 4fr;gap:32px}.aside{border-left:1px solid var(--rule);padding-left:24px}.finding{padding:20px 0;border-top:1px solid var(--rule)}.finding .number{font:11px 'IBM Plex Mono',monospace;color:var(--muted);display:block;margin-bottom:10px}.section{padding:28px 0;border-top:1px solid var(--rule);margin-top:28px}.chart-scroll{overflow-x:auto;max-width:100%}.chart{width:100%;display:block;background:var(--paper-raised)}svg text{font-family:Archivo,Arial,sans-serif;fill:var(--ink-soft);font-size:12px}svg .team-point{cursor:pointer;fill:var(--brand);stroke:var(--paper-raised);stroke-width:2}svg .team-point:hover{fill:var(--ink);stroke:var(--brand);stroke-width:3}.chart-key{display:flex;gap:24px;font-size:12px;margin:10px 0;color:var(--muted)}.table-wrap{max-width:100%;max-height:640px;overflow:auto;background:var(--paper-raised)}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;z-index:1;background:var(--paper-raised);color:var(--ink-soft);font-weight:500;text-align:left;white-space:nowrap}td,th{padding:14px 16px;border-bottom:1px solid var(--rule)}tbody tr:hover{background:var(--brand-soft)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.num{font-family:'IBM Plex Mono',monospace;font-size:12px}.team-link{border:0;padding:0;color:var(--brand);text-align:left;background:none;font-weight:600}.toolbar{display:flex;gap:24px;align-items:end;margin-bottom:24px}.toolbar label{min-width:200px;flex:1}.team-head{margin:24px 0}.record{display:flex;gap:50px;margin:24px 0;font-size:13px}.record strong{display:block;font-size:36px;line-height:1.2}.rotations{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.rotation{padding:18px;border-right:1px solid var(--rule)}.rotation:last-child{border:0}.rotation strong{font-size:24px;display:block}.rotation small{display:block;font-size:12px}.model-area{border-top:2px solid var(--model);padding-top:24px}.prob{color:var(--model);font-size:36px;font-weight:800}.empty{padding:32px 0;color:var(--muted)}.quality{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:24px 0}.quality strong{font-size:32px;display:block}.definitions{display:grid;grid-template-columns:1fr 1fr;gap:24px}.definition{border-top:1px solid var(--rule);padding-top:16px}.definition h3{font-size:17px}.footer{border-top:2px solid var(--ink);padding:22px 0 32px;display:flex;justify-content:space-between;gap:24px;font-size:11px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1100px){.wrap{padding:0 32px}.masthead{grid-template-columns:1fr}.filters{max-width:700px}.editorial{grid-template-columns:1fr}.aside{border-left:0;padding-left:0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.aside h3{grid-column:1/-1;margin-bottom:0}.kpi{padding:18px 10px}.kpi strong{font-size:30px}.rotations{grid-template-columns:repeat(3,1fr)}.rotation{border-bottom:1px solid var(--rule)}}
.chart-scroll{scrollbar-width:thin}
@media(max-width:600px){.chart-scroll .chart{min-width:620px}.chart-scroll .chart[viewBox="0 0 360 290"]{min-width:360px}.wrap{padding:0 18px}.masthead{padding:24px 0}.wordmark{margin-bottom:18px}h1{font-size:32px}h2{font-size:24px}h3{font-size:19px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}nav{gap:0;justify-content:space-between}nav button{font-size:12px;padding:14px 0}.subnav{gap:16px;justify-content:start;overflow:auto}.subnav button{white-space:nowrap}.kpis{grid-template-columns:1fr 1fr;margin-bottom:28px}.kpi{padding:18px 10px!important;border-bottom:1px solid var(--rule)}.kpi:nth-child(even){border-right:0}.kpi:last-child{grid-column:1/-1}.aside{display:block}.lead{display:block}.lead .badge{margin-top:8px}.toolbar{flex-direction:column;align-items:stretch;gap:16px}.toolbar label{min-width:0}.rotations{grid-template-columns:1fr}.rotation{border-right:0}.record{gap:24px;flex-wrap:wrap}.record strong{font-size:30px}.quality,.definitions{grid-template-columns:1fr}.footer{display:block}.footer span{display:block;margin-bottom:8px}.chart-key{flex-wrap:wrap}.subnav{margin-bottom:24px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}@media print{nav,.filters,.toolbar,button{display:none}body{background:white}.wrap{padding:0}.table-wrap{overflow:visible;max-height:none}.section{break-inside:avoid}}

</head><body>
<div class="wrap"><header class="masthead"><div><div class="wordmark"><span class="mark" aria-hidden="true"></span><span class="eyebrow">Vôlei BR / Dados & scouting</span></div><h1 id="title">Scouting editorial</h1><p id="subtitle" class="muted"></p></div><div class="filters"><label>Competição e categoria<select id="competition" aria-label="Competição e categoria"></select></label><label>Gênero<select id="gender" aria-label="Gênero"></select></label><label>Temporada<select id="season" aria-label="Temporada"></select></label></div></header>
<nav id="primary" aria-label="Navegação principal"></nav><main id="main" aria-live="polite"></main><footer class="footer"><span>Projeto independente • dados públicos disponibilizados pela CBV</span><span id="edition"></span></footer></div>
<script type="application/json" id="dataset">__SCOUTING_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent);
const state={page:'Visão geral',sub:'',cohort:0,team:'',opponent:'',rank:'adjusted',metric:'so',query:''};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=1)=>v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null?'—':fmt(v)+'%';const num=v=>fmt(v,0);const C=()=>DATA.cohorts[state.cohort];const team=()=>C()?.teams.find(t=>t.team===state.team);
const badge=(cls='DERIVADO')=>`<span class="badge ${cls==='MODELO'?'model':''}">${cls}</span>`;
function options(values,current){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
const compKey=c=>c.competition+' · '+(c.category||'Sem categoria');
function filters(){const c=C();$('#competition').innerHTML=options([...new Set(DATA.cohorts.map(compKey))],c?compKey(c):'');const comps=DATA.cohorts.filter(x=>compKey(x)===compKey(c));$('#gender').innerHTML=options([...new Set(comps.map(x=>x.gender||'Não informado'))],c.gender||'Não informado');$('#season').innerHTML=options(comps.filter(x=>x.gender===c.gender).map(x=>x.season),c.season);$('#title').textContent=c.competition==='SUPERLIGA'?'Superliga '+c.season:'CBS '+c.category+' · '+c.season;const update=c.matches.map(m=>m.created_at).filter(Boolean).sort().at(-1);$('#subtitle').textContent=`${c.matches.length} partidas ingeridas · ${c.teams.reduce((s,t)=>s+t.games,0)/2} validadas · ${c.gender} · atualização ${update?new Date(update).toLocaleDateString('pt-BR'):'não registrada'}`;$('#edition').textContent=`Edição gerada em ${new Date(DATA.generated_at).toLocaleString('pt-BR')} · ${DATA.data_version}`}
function chooseFilter(which,value){const current=C();let candidates=DATA.cohorts.filter(c=>which==='competition'?compKey(c)===value:compKey(c)===compKey(current)&& (which==='gender'?c.gender===value:c.gender===current.gender&&c.season===value));const selected=candidates.find(c=>c.gender===current.gender&&c.season===current.season)||candidates[0];state.cohort=DATA.cohorts.indexOf(selected);state.team='';state.opponent='';state.query='';render()}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map((h,i)=>`<th scope="col" class="${i?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}">Sem dados neste recorte.</td></tr>`}</tbody></table></div>`}
function row(cells){return '<tr>'+cells.map((x,i)=>`<td class="${i?'num':''}">${x}</td>`).join('')+'</tr>'}
function teamLink(t){return `<button class="team-link" data-team="${esc(t)}">${esc(t)}</button>`}
function tooltip(m){return `<details><summary>Definição e amostra</summary><p>${esc(m.formula)} × 100. Fonte: relatórios públicos CBV. Período: ${esc(C().season)}. ${badge(m.metric_class)} ${m.approximate?'Contagem reconstruída de percentuais arredondados; sem IC binomial.':''} Cobertura: ${num(m.covered_matches)} / ${num(m.total_matches)} registros equipe-jogo. Amostra ${esc(m.sample)}; rótulo descritivo de interface, sem garantia inferencial.</p></details>`}
function strip(metrics,comparison=false){return `<div class="kpis">${['so','bp','eff','positive','error'].map(k=>{let m=metrics[k];return `<div class="kpi"><span class="eyebrow">${esc(m.label)}</span><strong>${pct(m.value)}</strong><div class="details">${m.approximate?'≈ ':''}${num(m.numerator)} / ${num(m.n)} ${k==='so'?'rallies recebendo':k==='bp'?'rallies sacando':k==='positive'?'recepções':k==='error'?'saques':'ataques'}<br>${comparison&&m.delta!=null?`${m.delta>0?'+':''}${fmt(m.delta)} pp vs competição`:'Agregado do recorte'}<br>${m.ci?'IC 95% '+m.ci.map(v=>fmt(v)).join('–'):'IC não disponível'}</div>${tooltip(m)}</div>`}).join('')}</div>`}
function scatter(){const c=C(),points=c.teams.filter(t=>t.metrics.so.value!=null&&t.metrics.bp.value!=null);if(!points.length)return '<p class="empty">Sem contagens de SO/BP.</p>';const xs=points.map(t=>t.metrics.so.value),ys=points.map(t=>t.metrics.bp.value);let xmin=Math.floor(Math.min(...xs)/5)*5-5,xmax=Math.ceil(Math.max(...xs)/5)*5+5,ymin=Math.floor(Math.min(...ys)/5)*5-5,ymax=Math.ceil(Math.max(...ys)/5)*5+5;const X=v=>70+(v-xmin)/(xmax-xmin)*570,Y=v=>330-(v-ymin)/(ymax-ymin)*280;let s=`<svg class="chart" viewBox="0 0 700 410" role="img" aria-label="Dispersão Side-Out e Break Point por equipe"><title>Side-Out e Break Point; linhas tracejadas representam a média do recorte</title>`;for(let i=0;i<=4;i++){let x=xmin+(xmax-xmin)*i/4,y=ymin+(ymax-ymin)*i/4;s+=`<path d="M${X(x)},50 V330 M70,${Y(y)} H640" stroke="var(--rule)" fill="none"/><text x="${X(x)}" y="355" text-anchor="middle">${fmt(x,0)}%</text><text x="58" y="${Y(y)+4}" text-anchor="end">${fmt(y,0)}%</text>`}s+=`<path d="M${X(c.metrics.so.value)},50 V330 M70,${Y(c.metrics.bp.value)} H640" stroke="var(--ink)" stroke-dasharray="5 5" fill="none"/><text x="350" y="395" text-anchor="middle">Side-Out · rallies vencidos recebendo</text><text transform="translate(18,190) rotate(-90)" text-anchor="middle">Break Point · rallies vencidos sacando</text>`;for(const t of points){s+=`<g role="button" tabindex="0" data-team="${esc(t.team)}" aria-label="Abrir ${esc(t.team)}"><title>${esc(t.team)}: SO ${pct(t.metrics.so.value)}, n=${num(t.metrics.so.n)}; BP ${pct(t.metrics.bp.value)}, n=${num(t.metrics.bp.n)}</title><circle class="team-point" cx="${X(t.metrics.so.value)}" cy="${Y(t.metrics.bp.value)}" r="6"/></g>`}return s+'</svg><p class="note">Cada ponto representa uma equipe. Passe o cursor ou selecione um ponto para consultar o perfil. A tabela abaixo oferece os mesmos dados.</p>'}
function ranking(){const c=C();const ranked=[...c.teams].sort((a,b)=>(b.metrics[state.metric][state.rank]??b.metrics[state.metric].value??-Infinity)-(a.metrics[state.metric][state.rank]??a.metrics[state.metric].value??-Infinity));return `<div class="toolbar"><label>Indicador<select id="metric">${['so','bp','kill','attack_error','error','positive','excellent'].map(k=>`<option value="${k}" ${state.metric===k?'selected':''}>${esc(c.metrics[k].label)}</option>`).join('')}</select></label><label>Ordenação<select id="ranking"><option value="adjusted" ${state.rank==='adjusted'?'selected':''}>Taxa ajustada (modelo)</option><option value="value" ${state.rank==='value'?'selected':''}>Taxa bruta</option></select></label></div>${table(['Equipe','Taxa bruta · n','Ajustada '+badge('MODELO'),'Δ competição','Percentil','IC 95%'],ranked.map(t=>{let m=t.metrics[state.metric];return row([teamLink(t.team),`${pct(m.value)} · ${num(m.n)}${m.n<50?' ⚠':''}`,pct(m.adjusted),m.delta==null?'—':fmt(m.delta)+' pp',fmt(m.percentile,0),m.ci?m.ci.map(v=>fmt(v)).join('–'):'—'])}))}<p class="note">Ajuste beta-binomial por momentos da coorte; ordenação decrescente. Para erros, valores menores são preferíveis. Sem ajuste quando a fonte publica apenas percentuais arredondados ou a coorte é insuficiente. ⚠ n &lt; 50. Percentil usa posto médio de empates.</p>`}
function overview(){const c=C();let so=[...c.teams].filter(t=>t.metrics.so.value!=null).sort((a,b)=>b.metrics.so.value-a.metrics.so.value),bp=[...c.teams].filter(t=>t.metrics.bp.value!=null).sort((a,b)=>b.metrics.bp.value-a.metrics.bp.value);const findings=[so[0]?`${so[0].team} tem o maior Side-Out do recorte (${pct(so[0].metrics.so.value)}; n=${num(so[0].metrics.so.n)}).`:null,bp[0]?`${bp[0].team} tem o maior Break Point do recorte (${pct(bp[0].metrics.bp.value)}; n=${num(bp[0].metrics.bp.n)}).`:null,`${c.matches.filter(m=>m.validation_status!=='VALID').length} partidas têm ressalvas e ficam fora dos indicadores. Rankings descrevem a amostra disponível.`].filter(Boolean);return `<div class="lead"><h2>Leitura da competição</h2>${badge()}</div><p class="note">Recepção e saque organizam a leitura. Indicadores calculados apenas com partidas validadas do recorte selecionado.</p>${strip(c.metrics)}<div class="editorial"><section><div class="lead"><h3>O que define esta competição</h3>${badge()}</div>${scatter()}</section><aside class="aside"><h3>Leituras rápidas</h3>${findings.map((f,i)=>`<div class="finding"><span class="number">0${i+1} / ${i===2?'COBERTURA':'AMOSTRA OBSERVADA'}</span>${esc(f)}</div>`).join('')}</aside></div><section class="section"><div class="lead"><h3>Equipes em perspectiva</h3>${badge('MODELO')}</div>${ranking()}</section>`}
function selectors(two=false){return `<div class="toolbar"><label>Equipe<select id="team">${options(C().teams.map(t=>t.team),state.team)}</select></label>${two?`<label>Adversária<select id="opponent">${options(C().teams.filter(t=>t.team!==state.team).map(t=>t.team),state.opponent)}</select></label>`:''}</div>`}
function dotplot(t,other=null){let keys=['so','bp','kill','eff','pos_rec','neg_rec','trans','positive','excellent'];return `<div class="chart-key"><span>● ${esc(t.team)}</span><span>${other?'× '+esc(other.team):'│ média da competição · faixa P25–P75'}</span></div>`+keys.map(k=>{let m=t.metrics[k],ref=other?other.metrics[k].value:C().metrics[k].value;const X=v=>190+(v+100)/200*420;return `<svg class="chart" viewBox="0 0 720 48" role="img" aria-label="${esc(m.label)}: ${pct(m.value)} versus ${pct(ref)}"><text x="12" y="28">${esc(m.label)}</text><path d="M190,24 H610" stroke="var(--rule)"/>${!other&&m.p25!=null?`<path d="M${X(m.p25)},24 H${X(m.p75)}" stroke="var(--brand-soft)" stroke-width="12"/>`:''}${ref!=null?`<path d="M${X(ref)},16 v16" stroke="var(--ink)" stroke-width="2"/>`:''}${m.value!=null?`<circle cx="${X(m.value)}" cy="24" r="5" fill="var(--brand)"/>`:''}<text x="704" y="28" text-anchor="end">${pct(m.value)}</text></svg><p class="note">n=${num(m.n)} · ${other?'adversária '+pct(ref)+' · n='+num(other.metrics[k].n):'Δ '+fmt(m.delta)+' pp · percentil '+fmt(m.percentile,0)} · ${m.approximate?'contagem aproximada':'contagem disponível'}</p>`}).join('')+'<p class="note">Escala comum −100 a 100%. Valores numéricos e símbolos mantêm a comparação legível sem cor.</p>'}
function phases(t){return table(['Contexto','Tentativas','Kill%','Eficiência','Erro%','Bloqueado%','Δ eficiência'],['pos_rec','neg_rec','trans'].map(k=>{let m=t.metrics[k],e=t.metrics[k+'_eff'];return row([esc(m.label.split(' · ')[0]),num(m.n),pct(m.value),pct(e.value),pct(t.metrics[k+'_error'].value),pct(t.metrics[k+'_blocked'].value),fmt(e.delta)+' pp'])}))+`<p class="notice">${badge()} Kills de fase são reconstruídos a partir dos percentuais arredondados publicados. Kill% e eficiência têm definições distintas. Não há IC binomial para essas contagens aproximadas.</p>`}
function rotations(t){return `<h3>Rotações · ${esc(t.team)}</h3><p class="notice">A fonte agregada contém saldo por P1–P6. Faltam os denominadores de saque e recepção por rotação; SO, BP e intervalos por rotação não podem ser calculados.</p><div class="rotations">${t.rotations.map(r=>`<div class="rotation"><h3>${r.rotation}</h3>${badge('OBSERVADO')}<strong>${r.observed_balance>0?'+':''}${num(r.observed_balance)}</strong><small>saldo observado</small><small>${num(r.covered_matches)} relatórios</small><small>SO — · n indisponível</small><small>BP — · n indisponível</small></div>`).join('')}</div><p class="note">Referência da equipe: SO ${pct(t.metrics.so.value)} · n=${num(t.metrics.so.n)}; BP ${pct(t.metrics.bp.value)} · n=${num(t.metrics.bp.n)}. Competição: SO ${pct(C().metrics.so.value)} · n=${num(C().metrics.so.n)}; BP ${pct(C().metrics.bp.value)} · n=${num(C().metrics.bp.n)}.</p>`}
function athletes(t){return table(['Atleta','Pontos','Ataques','Kill%','Eficiência','Passe positivo · n','Erro recepção · n'],t.athletes.map(a=>row([esc(a.name),num(a.points),num(a.metrics.kill.n),pct(a.metrics.kill.value),pct(a.metrics.eff.value),pct(a.metrics.positive.value)+' · '+num(a.metrics.positive.n),pct(a.metrics.rec_error.value)+' · '+num(a.metrics.rec_error.n)])))+`<p class="note">${badge()} Kill% e eficiência usam o número de ataques da mesma linha. Percentuais de passe são médias ponderadas dos relatórios.</p>`}
function trend(t){const points=t.trend.filter(r=>r.so!=null);if(!points.length)return '<p class="empty">Sem histórico datado suficiente.</p>';const X=i=>55+i/Math.max(1,points.length-1)*590,Y=v=>220-v*2;return `<h3>Tendência de Side-Out ${badge()}</h3><svg class="chart" viewBox="0 0 700 270" role="img" aria-label="Média móvel ponderada dos últimos cinco jogos e média da temporada"><path d="M55,20 V220 H645" fill="none" stroke="var(--rule-strong)"/>${[0,25,50,75,100].map(v=>`<text x="45" y="${Y(v)+4}" text-anchor="end">${v}%</text>`).join('')}<path d="M55,${Y(t.metrics.so.value)} H645" stroke="var(--ink)" stroke-dasharray="4 4"/><polyline points="${points.map((p,i)=>X(i)+','+Y(p.so)).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2"/>${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.so)}" r="3" fill="var(--brand)"><title>${esc(p.date.slice(0,10))}: ${pct(p.so)}, n=${num(p.n)}</title></circle>`).join('')}<text x="55" y="250">${esc(points[0].date.slice(0,10))}</text><text x="645" y="250" text-anchor="end">${esc(points.at(-1).date.slice(0,10))}</text></svg><p class="note">Linha contínua: razão das contagens dos últimos 5 jogos (ou menos no início). Tracejado: temporada ${pct(t.metrics.so.value)} · n=${num(t.metrics.so.n)}.</p><details><summary>Valores da tendência</summary>${table(['Data','SO móvel · n'],points.map(p=>row([esc(p.date.slice(0,10)),pct(p.so)+' · '+num(p.n)])))}</details>`}
function teams(){const t=team();if(!t)return '<p class="empty">Nenhuma equipe com dados validados.</p>';let body=state.sub==='Fases'?phases(t):state.sub==='Rotações'?rotations(t):state.sub==='Atletas'?athletes(t):`<div class="team-head"><h2>${esc(t.team)}</h2><p class="muted">${esc(C().competition)} · ${esc(C().gender)} · ${esc(C().season)}</p><div class="record"><div><strong>${t.wins}–${t.losses}</strong>campanha validada</div><div><strong>${pct(t.metrics.so.value)}</strong>Side-Out · n=${num(t.metrics.so.n)}</div><div><strong>${pct(t.metrics.bp.value)}</strong>Break Point · n=${num(t.metrics.bp.n)}</div></div><p class="note">${t.games} jogos · Δ SO ${fmt(t.metrics.so.delta)} pp · amostra ${esc(t.metrics.so.sample)}</p></div><section class="section"><div class="lead"><h3>Perfil de fase</h3>${badge()}</div>${dotplot(t)}</section><section class="section">${trend(t)}</section>`;return selectors()+body}
function model(a,b){const c=C(),m=c.model_matchups.find(m=>new Set([m.team_a,m.team_b]).has(a.team)&&new Set([m.team_a,m.team_b]).has(b.team));const ev=c.evaluation;return `<section class="model-area"><div class="lead"><h3>Probabilidade de vitória</h3>${badge('MODELO')}</div>${m?`<p>${esc(a.team)} <span class="prob">${pct(100*(m.team_a===a.team?m.probability_a:1-m.probability_a))}</span></p><p class="note">Regressão logística L2 · SO, BP, eficiência, K1+, K1−, K2 e forma recente. Apenas a coorte selecionada. Sem efeito de mando presumido; inverter as equipes inverte a probabilidade.</p>`:'<p class="empty">Histórico anterior insuficiente para ajustar o modelo nesta coorte.</p>'}<p class="notice">Intervalo preditivo ainda não estimado. A probabilidade é uma estimativa de modelo; a amostra de sets não fornece um intervalo válido para vitórias em partidas.</p><h3>Validação temporal</h3>${ev.total_matches===0?'<p class="notice">Sem previsões fora da amostra nesta coorte. Modelo ainda não validado.</p>':''}<p class="note">${esc(ev.method)}. ${num(ev.total_matches)} previsões fora da amostra · mínimo de 20 exemplos anteriores para treinamento. Partidas sem data ou com ressalvas ficam fora.</p>${table(['Brier score','Log loss','Erro de calibração','Acurácia secundária'],[row([fmt(ev.brier_score,3),fmt(ev.log_loss,3),fmt(ev.calibration_error,3),pct(ev.accuracy_pct)])])}<h3 class="section">Curva de calibração</h3>${calibration(ev)}${table(['Faixa','n','Prob. média','Frequência observada'],Object.entries(ev.calibration).map(([k,v])=>row([esc(k),num(v.pred_count),v.mean_probability==null?'—':pct(100*v.mean_probability),v.observed_frequency==null?'—':pct(100*v.observed_frequency)])))}</section>`}
function calibration(ev){const bins=Object.values(ev.calibration).filter(b=>b.pred_count);return `<svg class="chart" viewBox="0 0 360 290" role="img" aria-label="Probabilidade média do favorito versus frequência observada"><path d="M45,240 L285,20" stroke="var(--rule-strong)" stroke-dasharray="4 4"/><path d="M45,20 V240 H285" stroke="var(--rule)" fill="none"/>${bins.map(b=>`<circle cx="${45+b.mean_probability*240}" cy="${240-b.observed_frequency*220}" r="5" fill="var(--model)"><title>n=${b.pred_count}; prevista ${pct(100*b.mean_probability)}, observada ${pct(100*b.observed_frequency)}</title></circle>`).join('')}<text x="45" y="258">0%</text><text x="280" y="258">100%</text><text x="35" y="25" text-anchor="end">100%</text><text x="170" y="282" text-anchor="middle">Probabilidade média do favorito</text></svg>`}
function confrontation(){const a=team(),b=C().teams.find(t=>t.team===state.opponent);if(!a||!b)return '<p class="empty">São necessárias duas equipes com dados nesta coorte.</p>';return selectors(true)+`<h2>${esc(a.team)} × ${esc(b.team)}</h2><p class="note">SO ${pct(a.metrics.so.value)} · n=${num(a.metrics.so.n)} × ${pct(b.metrics.so.value)} · n=${num(b.metrics.so.n)}<br>BP ${pct(a.metrics.bp.value)} · n=${num(a.metrics.bp.n)} × ${pct(b.metrics.bp.value)} · n=${num(b.metrics.bp.n)}</p>`+(state.sub==='Modelo'?model(a,b):state.sub==='Rotações'?rotations(a)+'<section class="section">'+rotations(b)+'</section>':`<section class="section"><div class="lead"><h3>Diferenças observadas</h3>${badge()}</div>${dotplot(a,b)}</section><section class="section"><h3>Fases · ${esc(a.team)}</h3>${phases(a)}<h3>Fases · ${esc(b.team)}</h3>${phases(b)}</section><section class="section"><h3>Atletas · ${esc(a.team)}</h3>${athletes(a)}<h3>Atletas · ${esc(b.team)}</h3>${athletes(b)}</section><section class="section"><h3>Histórico de confrontos</h3>${matchTable(C().matches.filter(m=>[m.home_team,m.away_team].includes(a.team)&&[m.home_team,m.away_team].includes(b.team)))}</section><p class="note">A previsão e sua validação estão em Confronto → Modelo, após a comparação dos dados observados.</p>`)}
function matchTable(mm){return table(['Data','Equipe mandante','Placar','Equipe visitante','Validação','Fonte'],mm.map(m=>row([esc(m.date?.slice(0,10)||'Sem data'),esc(m.home_team),m.home_sets==null||m.away_sets==null?'—':`${m.home_sets} × ${m.away_sets}`,esc(m.away_team),esc(m.validation_status),`<a href="https://cbv.com.br/jogo/${encodeURIComponent(m.match_id)}" target="_blank" rel="noopener">Jogo ${esc(m.match_id)}</a>`])))}
function matchesPage(){const c=C();if(state.sub==='Calendário')return `<h2>Calendário</h2><p class="note">${badge('OBSERVADO')} Calendário armazenado; consulte a fonte para alterações de horário.</p>${table(['Data','Mandante','Visitante','Local','Fonte'],c.upcoming.map(m=>row([esc(m.match_date)+' '+esc(m.match_time),esc(m.home_team),esc(m.away_team),esc(m.gym),`<a href="https://cbv.com.br/jogo/${encodeURIComponent(m.match_id)}" target="_blank" rel="noopener">CBV</a>`])))}`;const q=state.query.toLocaleLowerCase('pt-BR');const mm=[...c.matches].reverse().filter(m=>`${m.home_team} ${m.away_team} ${m.match_id} ${m.date}`.toLocaleLowerCase('pt-BR').includes(q));return `<h2>${esc(state.sub)}</h2><label class="toolbar">Buscar equipe, data ou ID<input id="search" value="${esc(state.query)}" placeholder="Buscar nas partidas deste recorte"></label>${matchTable(mm)}<p class="note">Links abrem a página pública da partida; a URL direta do documento não foi preservada no legado.</p>`}
function dataPage(){const c=C(),valid=c.matches.filter(m=>m.validation_status==='VALID'),warnings=c.matches.filter(m=>m.validation_status==='WARNING');if(state.sub==='Definições das métricas')return `<h2>Definições das métricas</h2><p class="note">${badge('OBSERVADO')} contagens publicadas · ${badge()} cálculos determinísticos · ${badge('MODELO')} hipóteses e estimativas</p><div class="definitions">${Object.values(c.metrics).map(m=>`<section class="definition"><h3>${esc(m.label)} ${badge(m.metric_class)}</h3><p>${esc(m.formula)} × 100</p>${tooltip(m)}</section>`).join('')}</div><section class="section"><h3>Métodos de comparação</h3><p>Δ: diferença em pontos percentuais para a razão das somas da competição. Percentil: posição relativa entre equipes da mesma coorte, com empates em posto médio. Wilson 95%: somente proporções de contagens diretas; rallies podem ter dependência e o intervalo é uma aproximação descritiva. Rankings ajustados: prior beta empírico por momentos, com intensidade limitada entre 2 e 10.000. Estabilidade descritiva: n &lt; 20 muito baixa, 20–49 baixa, 50–99 moderada, 100+ estável. Esses limites são regras de interface.</p></section>`;if(state.sub==='Atualizações')return `<h2>Atualizações e proveniência</h2><p>Dados atualizados pela rotina de coleta existente. A data de geração da página não comprova uma nova coleta da fonte.</p><p class="note">Versão dos dados: ${esc(DATA.data_version)}. Parser do legado: não registrado.</p>${table(['Jogo','Registro no banco','Parser','Consulta à fonte','Documento'],c.matches.map(m=>row([esc(m.match_id),esc(m.created_at||'Não registrado'),esc(m.provenance?.parser_version||'Não registrado'),esc(m.provenance?.fetched_at||'Não registrada'),esc(m.provenance?.source_document_id||'Não preservado')])))}`;return `<h2>${esc(state.sub)}</h2><div class="quality"><div><strong>${c.matches.length}</strong>partidas ingeridas</div><div><strong>${valid.length}</strong>partidas validadas</div><div><strong>${warnings.length}</strong>partidas com ressalvas</div></div><p class="note">Erros/rejeições no banco: ${c.matches.filter(m=>!['VALID','WARNING'].includes(m.validation_status)).length}. Falhas de download sem registro não são contabilizadas nesta base. Somente partidas VALID entram nos indicadores.</p><h3 class="section">Cobertura dos indicadores</h3>${table(['Métrica','Registros disponíveis','Ações / rallies','Classe'],Object.values(c.metrics).map(m=>row([esc(m.label),`${m.covered_matches} / ${m.total_matches}`,num(m.n),badge(m.metric_class)])))}<h3 class="section">Campos ausentes e limites da fonte</h3><p>Partidas sem data: ${c.matches.filter(m=>!m.date).length}. Proveniência do parser não registrada: ${c.matches.filter(m=>!m.provenance?.parser_version).length}. Correções históricas: não registradas; nenhuma correção automática é presumida.</p><p class="notice">SO/BP por rotação, xSO/xBP, FBSO, primeira transição, Set Assist, distribuição observada da levantadora, entropia, Markov e crunch: planejados. Faltam eventos vinculando contatos, placar, rotação e resultado de cada rally. As tabelas de eventos estão preparadas, sem preenchimento sintético.</p><p class="note">Distribuição de amostra por equipe: consulte Visão geral → Equipes em perspectiva. A taxa de erro principal é erro de saque por saque disponível; não erro total por rally.</p><details><summary>Sincronizar e exportar (servidor local)</summary><label>URL pública da competição<input id="sync-url" type="url" placeholder="https://cbv.com.br/..."></label><button id="sync">Sincronizar dados</button><button id="export">Exportar CSV, JSON e HTML</button><p id="operation-status" role="status"></p><p class="note">No GitHub Pages, a atualização é executada pelo workflow diário do repositório.</p></details>`}
function render(){if(!DATA.cohorts.length){$('#main').innerHTML='<h2>Sem partidas disponíveis</h2><p>Execute a coleta para iniciar a leitura.</p>';return}const c=C();if(!c.teams.some(t=>t.team===state.team))state.team=c.teams[0]?.team||'';if(!c.teams.some(t=>t.team===state.opponent)||state.opponent===state.team)state.opponent=c.teams.find(t=>t.team!==state.team)?.team||'';filters();$('#primary').innerHTML=['Visão geral','Equipes','Confronto','Partidas','Dados'].map(p=>`<button data-page="${p}" ${p===state.page?'aria-current="page"':''}>${p}</button>`).join('');const subs={Equipes:['Perfil','Fases','Rotações','Atletas'],Confronto:['Comparativo','Rotações','Modelo'],Partidas:['Calendário','Jogos encerrados','Súmulas'],Dados:['Cobertura','Qualidade dos dados','Definições das métricas','Atualizações']}[state.page]||[];if(!subs.includes(state.sub))state.sub=subs[0]||'';const subnav=subs.length?`<nav class="subnav" aria-label="Seções de ${esc(state.page)}">${subs.map(s=>`<button data-sub="${esc(s)}" ${s===state.sub?'aria-current="page"':''}>${esc(s)}</button>`).join('')}</nav>`:'';$('#main').innerHTML=subnav+({ 'Visão geral':overview,Equipes:teams,Confronto:confrontation,Partidas:matchesPage,Dados:dataPage}[state.page])();bind()}
function bind(){document.querySelectorAll('#main svg.chart').forEach(svg=>{const box=document.createElement('div');box.className='chart-scroll';box.tabIndex=0;box.setAttribute('role','region');box.setAttribute('aria-label',svg.getAttribute('aria-label')+' · rolagem horizontal em telas pequenas');svg.before(box);box.append(svg)});document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{state.page=el.dataset.page;state.sub='';render()});document.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>{state.sub=el.dataset.sub;render()});document.querySelectorAll('[data-team]').forEach(el=>{const go=()=>{state.team=el.dataset.team;state.page='Equipes';state.sub='Perfil';render();$('#main').scrollIntoView({block:'start',behavior:'instant'})};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});for(const [id,key] of [['team','team'],['opponent','opponent'],['ranking','rank'],['metric','metric']])if($('#'+id))$('#'+id).onchange=e=>{state[key]=e.target.value;render()};if($('#search'))$('#search').oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#sync'))$('#sync').onclick=()=>operation('/api/sync',{url:$('#sync-url').value||null},true);if($('#export'))$('#export').onclick=()=>operation('/api/export-all',{},false)}
async function operation(url,body,reload){const status=$('#operation-status');if(!['localhost','127.0.0.1'].includes(location.hostname)){status.textContent='Esta operação requer o servidor local: python -m cbv app';return}status.textContent='Processando…';try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await res.json();if(!res.ok)throw new Error(result.detail||'Falha na operação');status.textContent=result.message||'Concluído.';if(reload)location.reload()}catch(e){status.textContent=e.message}}
for(const id of ['competition','gender','season'])$('#'+id).onchange=e=>chooseFilter(id,e.target.value);
render();
</script></body></html>
