[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbv-volley-data"
version = "0.1.0"
description = "Pipeline de coleta, extração e análise de dados de voleibol da CBV"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CBV Volley Data Project" }]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "pandas>=2.1.0",
    "duckdb>=0.9.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
cbv = "cbv.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
cbv = ["database/schema.sql", "export/templates/*.html", "export/templates/fonts/*"]
